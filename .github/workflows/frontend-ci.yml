name: Frontend CI

on:
  push:
    branches: [main, "phase-1/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: Syntax-check standalone village JavaScript
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const html = fs.readFileSync("index.html", "utf8");
          const scripts = [...html.matchAll(/<script\\b[^>]*>([\\s\\S]*?)<\\/script>/gi)]
            .map((match) => match[1])
            .filter((source) => source.trim().length > 0);
          if (!scripts.length) throw new Error("No inline village script found.");
          fs.writeFileSync("/tmp/tonkas-village.js", scripts.join("\\n"));
          NODE
          node --check /tmp/tonkas-village.js
