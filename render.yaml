services:
  - type: web
    name: tonkas-town-runtime
    runtime: python
    rootDir: backend
    plan: starter
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: tonkas-town-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: HQ_DB_PATH
        value: /var/data/hq.sqlite3
      - key: HQ_ALLOWED_ORIGINS
        value: https://yazoniplay.github.io
      - key: HQ_AUTONOMY_DEFAULT
        value: "false"
      - key: HQ_DEFAULT_PROVIDER
        value: openai
      - key: HQ_TICK_SECONDS
        value: "45"
      - key: HQ_ADMIN_TOKEN
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
